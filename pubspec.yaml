name: osynk
description: "OneDrive 文件同步工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  http: ^1.6.0
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1
  fluttertoast: ^9.0.0
  flutter_local_notifications: ^19.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
